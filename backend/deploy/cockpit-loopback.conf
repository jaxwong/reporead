# Installed by hand as /etc/systemd/system/cockpit.socket.d/reporead-loopback.conf (root 0644); see backend/README.md
# "Hosted VM". Cockpit's web console shows the journal, which holds the app's lines and their note text, so it listens
# on loopback only and is reached through an SSH tunnel, never through Caddy or an open port.
[Socket]
ListenStream=
ListenStream=127.0.0.1:9090
