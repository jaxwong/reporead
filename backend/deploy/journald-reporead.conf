# Installed by hand as /etc/systemd/journald.conf.d/reporead.conf (root 0644); see backend/README.md "Hosted VM".
# The journal was volatile, so the 2026-10-16 reboot erased the logs that explained it. Persistent, it keeps the
# backend's logs across reboots, capped so it cannot fill the boot volume; the oldest entries go first.
[Journal]
Storage=persistent
SystemMaxUse=1G
