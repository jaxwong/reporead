spring.application.name=reporead
server.address=127.0.0.1
# Docker already owns 8080 on the development Mac; do not stop that unrelated service.
server.port=8081
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# Actuator: only health and metrics, on a separate loopback port that adb reverse (8081 only) does not reach.
management.server.address=127.0.0.1
management.server.port=8082
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# Where the phone and GitHub reach this server: http://127.0.0.1:8081 through adb reverse on the Mac, or the hosted
# HTTPS origin. The OAuth callback is built from it, never from a request's Host header. Required; no default.
reporead.public-url=${REPOREAD_PUBLIC_URL}
# Hosted, a local HTTPS proxy (Caddy) forwards to this loopback server. Tomcat honours its X-Forwarded-Proto/For only
# from internal addresses, and the server accepts loopback connections only, so redirects and the session cookie
# stay on HTTPS. Without a proxy (the Mac) nothing is forwarded and nothing changes.
server.forward-headers-strategy=native
reporead.github.client-id=${REPOREAD_GITHUB_CLIENT_ID}
reporead.github.client-secret-file=${REPOREAD_GITHUB_CLIENT_SECRET_FILE}
# AES-256 key (64 hex characters, mode 0600) that encrypts stored GitHub tokens; see GitHubTokens. Required; no default.
reporead.github.token-key-file=${REPOREAD_GITHUB_TOKEN_KEY_FILE}
# Required; no fallback database. Local values are in backend/README.md.
spring.datasource.url=${REPOREAD_DB_URL}
spring.datasource.username=${REPOREAD_DB_USERNAME}
spring.datasource.password=${REPOREAD_DB_PASSWORD}
# pgjdbc waits for the server's login reply forever by default. A database that accepts the connection but never
# answers (once on the hosted VM, after a firewalld reload wiped Podman's NAT rules) must fail startup and requests
# within 10 s instead (DatabaseTimeoutTest).
spring.datasource.hikari.data-source-properties.loginTimeout=10
