# Android app CI and releases (ADR-15). Pull requests: unit tests only, no secrets (packaging needs the signing key).
# Pushes to main: unit tests, then a signed release APK published as GitHub Release v0.1.<commit count>, which
# Obtainium on the phone installs over the current app. This repository is public, so the APKs and logs are too;
# nothing prints secrets.
name: Android

on:
  pull_request:
    paths: [android/**, '!android/**/*.md', build.gradle.kts, settings.gradle.kts, gradle.properties, gradle/**, gradlew, .github/workflows/android.yml]
  push:
    branches: [main]
    paths: [android/**, '!android/**/*.md', build.gradle.kts, settings.gradle.kts, gradle.properties, gradle/**, gradlew, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # versionCode is the commit count
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install reader dependencies
        working-directory: android/reader-web
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install reader dependencies
        working-directory: android/reader-web
        run: npm ci --ignore-scripts

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release-password.txt"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/release-password.txt"
          ./gradlew :app:assembleRelease --no-daemon \
            -Preporead.signing.storeFile="$RUNNER_TEMP/release.jks" \
            -Preporead.signing.passwordFile="$RUNNER_TEMP/release-password.txt"

      - name: Check the APK is signed with the personal key
        run: |
          # SHA-256 of the personal signing certificate (android/README.md). An APK signed by any other key could not
          # update the installed app, so a wrong secret must fail here rather than publish.
          expected=2049299fc6e40dc666fb2a7a407f51059bfb3cc3e9a32e9cc38d91a1e153293f
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          actual=$("$apksigner" verify --print-certs android/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$actual" = "$expected" ] || { echo "APK signed by '$actual', expected $expected" >&2; exit 1; }

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.$(git rev-list --count HEAD)"
          apk="reporead-$version.apk"
          cp android/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "v$version" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "RepoRead $version" \
            --notes "Release build of $GITHUB_SHA, talking to https://reporead.duckdns.org. Installed on the phone by Obtainium (android/README.md)."
