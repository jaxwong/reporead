# Android app CI and releases (ADR-15). Pull requests: Lint, unit tests, the reader's check and bundle, and a compile of
# the device tests, no secrets (packaging needs the signing key; the device tests run on the phone, android/README.md).
# The app's wire models are generated from backend/openapi.json, which the backend's OpenApiSpecTest derives from its
# controllers and records, so a backend change runs this workflow and a stale spec fails it. Backend deployment retains
# its own workflow triggers.
# Besides android/, the build reads Library.java (the library size cap) and the release check reads assetlinks.json, so a
# change to either runs this workflow too.
# Pushes to main: the test job, then a signed release APK published as GitHub Release v0.1.<commit count>, which
# Obtainium on the phone installs over the current app. This repository is public, so the APKs and logs are too;
# nothing prints secrets.
name: Android

on:
  pull_request:
    paths: [android/**, '!android/**/*.md', build.gradle.kts, settings.gradle.kts, gradle.properties, gradle/**, gradlew, .github/workflows/android.yml, backend/**, '!backend/**/*.md']
  push:
    branches: [main]
    paths: [android/**, '!android/**/*.md', build.gradle.kts, settings.gradle.kts, gradle.properties, gradle/**, gradlew, .github/workflows/android.yml, backend/**, '!backend/**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # versionCode is the commit count
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Fails on any app Kotlin file ktfmt would change; ./gradlew :app:spotlessApply fixes it.
      - name: Check app formatting
        run: ./gradlew :app:spotlessCheck --no-daemon
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Install reader dependencies
        working-directory: android/reader-web
        run: npm ci --ignore-scripts
      # The reader's syntax check and bundle (bundleReader, npm run build) through the same asset wiring a packaged app
      # uses; compiling the device tests does not merge assets, so without this a broken reader.js passes.
      - name: Check and bundle the reader
        run: ./gradlew :app:mergeDebugAssets --no-daemon
      # The committed spec the app's models are generated from, and the item-refusal pairs its RefusalTest reads.
      - name: Verify the published API spec
        run: ./gradlew :backend:test --tests '*OpenApiSpecTest' --tests '*ItemRefusalsTest' --no-daemon
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      # The device tests (Room, migrations, sync, the reader) run on a phone, not here; compiling them catches a change
      # that breaks them before anyone installs them.
      - name: Compile device tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install reader dependencies
        working-directory: android/reader-web
        run: npm ci --ignore-scripts

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release-password.txt"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/release-password.txt"
          ./gradlew :app:assembleRelease --no-daemon \
            -Preporead.signing.storeFile="$RUNNER_TEMP/release.jks" \
            -Preporead.signing.passwordFile="$RUNNER_TEMP/release-password.txt"

      - name: Check the APK is signed with the personal key
        run: |
          # SHA-256 of the personal signing certificate (android/README.md), read from the hosted server's
          # .well-known/assetlinks.json: the key that statement lets open the sign-in link is the key the APK must have.
          # An APK signed by any other key could not update the installed app, so a wrong secret must fail here.
          # The digest is computed from the PEM certificate, not parsed from apksigner's prose, whose wording changed
          # between build-tools 36 ("Signer #1 certificate …") and 37 ("V2 Signer: certificate …").
          expected=$(jq -r '.[0].target.sha256_cert_fingerprints[0]' backend/src/main/resources/static/.well-known/assetlinks.json \
            | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          certs=$("$apksigner" verify --print-certs-pem android/build/outputs/apk/release/app-release.apk)
          count=$(grep -c 'BEGIN CERTIFICATE' <<<"$certs" || true)
          actual=$(openssl x509 -outform DER <<<"$certs" | sha256sum | cut -d' ' -f1)
          if [ "$count" != 1 ] || [ "$actual" != "$expected" ]; then
            echo "APK has $count signing certificate(s), first SHA-256 $actual; expected exactly one, $expected" >&2
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.$(git rev-list --count HEAD)"
          apk="reporead-$version.apk"
          cp android/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "v$version" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "RepoRead $version" \
            --notes "Release build of $GITHUB_SHA, talking to https://reporead.duckdns.org. Installed on the phone by Obtainium (android/README.md)."
